name: solana-narrative-radar
region: fra
services:
  - name: api
    image:
      registry: ai-trainer
      registry_type: DOCR
      repository: narrative-radar
      tag: latest
      deploy_on_push:
        enabled: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    envs:
      - key: GITHUB_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
